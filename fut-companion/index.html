<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SquadSage</title>
  <meta name="description" content="Offline FUT companion: unlimited SBC solver, squad builder and trade tracker. No account login.">
  <meta name="theme-color" content="#0d1420">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>Squad<b>Sage</b></span></div>
    <div class="row center gap">
      <span class="pill" id="net"></span>
      <button class="icon-btn" data-a="settings" aria-label="Settings">⚙︎</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="nav" aria-label="Main">
    <button data-tab="home"><span aria-hidden="true">⌂</span>Home</button>
    <button data-tab="sbc"><span aria-hidden="true">✦</span>SBC</button>
    <button data-tab="squad"><span aria-hidden="true">◎</span>Squad</button>
    <button data-tab="club"><span aria-hidden="true">▤</span>Club</button>
    <button data-tab="trades"><span aria-hidden="true">⇄</span>Trades</button>
  </nav>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
