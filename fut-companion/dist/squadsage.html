<title>SquadSage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #0d1420;
  --bg2: #141d2c;
  --panel: #18233456;
  --line: #26344a;
  --text: #e9eef6;
  --muted: #8b9ab2;
  --accent: #12c2a0;
  --accent-ink: #062a23;
  --good: #3ddc84;
  --bad: #ff6b6b;
  --warn: #ffc857;
  --gold: #e6c35c;
  --silver: #b9c2cf;
  --bronze: #c98a5a;
  --special: #b88cff;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
code { background: var(--bg); padding: 1px 5px; border-radius: 6px; font-size: 12px; word-break: break-all; }

.top {
  position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 18px; letter-spacing: .01em; }
.brand b { color: var(--accent); }
.pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }

main { max-width: 620px; margin: 0 auto; padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
textarea { resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-around;
  background: var(--bg2); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav button {
  flex: 1; max-width: 110px; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
  align-items: center; gap: 1px; font-size: 12px; padding: 4px 0; cursor: pointer; border-radius: 10px;
}
.nav button span { font-size: 20px; line-height: 1.1; }
.nav button.on { color: var(--text); }
.nav button.on span { color: var(--accent); }

.sec { font-size: 18px; margin: 26px 0 10px; }
.sec.first { margin-top: 18px; }
.sec.flat { margin: 0; }
.first { margin-top: 18px; }
.muted { color: var(--muted); font-weight: 400; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.row { display: flex; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .center { align-items: center; }
.between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }

.hero { padding: 22px 0 6px; }
.hero h1 { font-size: 24px; margin: 0 0 8px; }
.hero p { color: var(--muted); margin: 0 0 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--bg2); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; min-height: 44px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn.tiny { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { background: none; border: 1px solid transparent; color: var(--muted); font-size: 18px; min-width: 36px; min-height: 36px; border-radius: 10px; cursor: pointer; }
.icon-btn:hover { border-color: var(--line); color: var(--text); }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0 0 0 6px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats.three { grid-template-columns: repeat(3, 1fr); }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-size: 20px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
.coin { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a3, #d9a930 60%, #a87912); flex: none; }

.callout { border: 1px solid var(--line); background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; }
.callout .row { margin-top: 10px; }
.callout.good { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); color: var(--good); }
.callout.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }

.fixes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.fixes li { background: var(--bg2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
.fixes b { color: var(--text); }

.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 14px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.span2 { grid-column: 1 / -1; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 42px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.inline select { min-height: 38px; }

.switch { flex-direction: row; align-items: center; gap: 10px; color: var(--text); font-size: 14px; cursor: pointer; padding: 4px 0; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { left: 19px; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); }
.toggles { margin: 12px 0; display: grid; gap: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg2); border-radius: 99px; padding: 7px 13px; cursor: pointer; font-size: 14px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip-wrap { display: inline-flex; align-items: center; }
.chip-wrap .chip { border-radius: 99px 0 0 99px; }
.chip-x { border: 1px solid var(--line); border-left: 0; background: var(--bg2); border-radius: 0 99px 99px 0; padding: 7px 10px; cursor: pointer; color: var(--muted); }

.reqs { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 6px; }
.reqs li { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 4px 4px 12px; min-height: 44px; }
.addreq summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.addreq .btn { margin-top: 10px; }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.checks li { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--bg2); }
.checks li em { margin-left: auto; font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.checks li.ok span { color: var(--good); } .checks li.no { color: var(--bad); }

.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }

/* pitch */
.pitch {
  position: relative; aspect-ratio: 3 / 4; margin: 14px 0; border-radius: 18px; overflow: hidden;
  background: repeating-linear-gradient(180deg, #14533d 0 10%, #186147 10% 20%);
  border: 1px solid #1f7556;
}
.pitch-lines { position: absolute; inset: 4%; border: 2px solid #ffffff2a; border-radius: 6px; }
.pitch-lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid #ffffff2a; }
.pitch-lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border: 2px solid #ffffff2a; border-radius: 50%; transform: translate(-50%, -50%); }
.slot { position: absolute; transform: translate(-50%, -50%); width: 17%; }
.slot-btn { all: unset; display: block; cursor: pointer; border-radius: 10px; }
.slot-btn:focus-visible { outline: 2px solid #fff; }
.pcard {
  position: relative; border-radius: 10px; padding: 4px 3px 5px; text-align: center; color: #1b1406;
  background: linear-gradient(160deg, #f5e3a1, var(--gold)); box-shadow: 0 2px 8px #0006; font-size: 10px; line-height: 1.2;
}
.pcard.silver { background: linear-gradient(160deg, #eef1f5, var(--silver)); }
.pcard.bronze { background: linear-gradient(160deg, #ecc29e, var(--bronze)); }
.pcard.rare { box-shadow: 0 0 0 2px #fff8, 0 2px 8px #0006; }
.pcard.special { background: linear-gradient(160deg, #e7d8ff, var(--special)); }
.pcard.empty { background: #ffffff14; color: #fff; border: 1.5px dashed #ffffff55; box-shadow: none; min-height: 58px; display: flex; flex-direction: column; justify-content: center; }
.pcard.empty span { font-size: 18px; opacity: .7; }
.pc-top { display: flex; justify-content: space-between; padding: 0 3px; }
.pc-top b { font-size: 14px; }
.pc-top small { font-size: 9px; font-weight: 700; opacity: .75; }
.pc-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }
.pc-meta { font-size: 9px; opacity: .7; }
.chem { display: block; font-size: 8px; letter-spacing: 1px; }
.chem.c0 { color: #b02a2a; } .chem.c1, .chem.c2 { color: #7a5b00; } .chem.c3 { color: #0b6b3a; }
.pc-tags { position: absolute; top: -7px; right: -4px; display: flex; gap: 2px; }

.tag { font-style: normal; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 6px; background: var(--line); color: var(--text); }
.tag.ut { background: #3a4a63; color: #cfe0ff; }
.tag.dup { background: #5a4a1b; color: #ffe3a0; }
.tag.buy { background: var(--warn); color: #3b2a00; }
.tag.sp { background: var(--special); color: #241046; text-transform: uppercase; }

/* lists */
.list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.li { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 52px; }
.li small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li > div { min-width: 0; }
.li-main { all: unset; flex: 1; min-width: 0; cursor: pointer; }
.li-main:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
.li-main b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pills { display: flex; gap: 4px; }
.badge { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #1b1406; background: var(--gold); }
.badge.silver { background: var(--silver); } .badge.bronze { background: var(--bronze); }
.badge.rare { box-shadow: inset 0 0 0 2px #fff9; }
.icon-btn.on { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.trade .acts { display: flex; gap: 4px; align-items: center; }
.toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin: 12px 0 8px; }
.addtrade { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 8px; align-items: end; }

.prices { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
.prices label { flex-direction: row; align-items: center; gap: 6px; }

dialog {
  width: min(560px, calc(100vw - 24px)); max-height: 86vh; border: 1px solid var(--line); border-radius: 18px;
  background: var(--bg2); color: var(--text); padding: 18px; overflow: auto;
}
dialog::backdrop { background: #000a; }
dialog h2 { margin-top: 0; }
dialog .row { margin-top: 12px; }
dialog form .row { margin-top: 4px; }
.picker { max-height: 52vh; overflow: auto; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none;
  transition: .2s; max-width: calc(100vw - 32px); z-index: 20; font-weight: 600;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.bad { background: var(--bad); color: #2b0000; }

@media (max-width: 480px) {
  .addtrade { grid-template-columns: 1fr 1fr; }
  .addtrade label:first-child { grid-column: 1 / -1; }
  .addtrade .btn { grid-column: 1 / -1; }
  .toolbar { grid-template-columns: 1fr 1fr; }
  .toolbar input { grid-column: 1 / -1; }
  .stat b { font-size: 18px; }
  .pill { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* trade rows wrap on narrow screens instead of overflowing */
.trade { flex-wrap: wrap; }
.trade .acts { margin-left: auto; }
.row.between { flex-wrap: wrap; gap: 8px; }
.row.between > .row select { width: auto; min-height: 36px; padding: 4px 8px; }
html, body { overflow-x: hidden; }
@media (max-width: 480px) {
  .trade .grow { flex-basis: calc(100% - 90px); }
  .trade .acts { width: 100%; justify-content: flex-end; }
}

/* EA account panel */
.pill.on { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.ea .row { margin-top: 10px; }
.ealog { margin-top: 12px; font-size: 13px; }
.ealog summary { cursor: pointer; color: var(--muted); }
.ealog ul { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; }
.ealog li { color: var(--muted); }
.ealog li.good { color: var(--good); } .ealog li.bad { color: var(--bad); }
.ealog time { font-variant-numeric: tabular-nums; opacity: .7; margin-right: 6px; }

/* live mode */
.pill:empty { display: none; }
.small { font-size: 13px; }
.login { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-block: 24px; }
.login img { border-radius: 18px; }
.login h1 { margin: 0; font-size: 24px; text-wrap: balance; }
.login p { margin: 0; max-width: 34ch; }
.login .wide { min-width: 240px; font-size: 16px; }
.login .warnline { color: var(--muted); max-width: 36ch; }
.login .ealog { align-self: stretch; text-align: left; }
.spin.big { width: 28px; height: 28px; border-width: 3px; color: var(--accent); }
.acct { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 18px 6px; }
.acct small { display: block; }
.acct b { font-size: 20px; }
.acct .coins { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.syncbar { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; margin: 8px 0 10px; }
.actions { margin-top: 14px; }
.foot { margin-top: 22px; }
.practice { margin: 14px 0; }
.practice > summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 6px 0; }
.practice .chips { margin-top: 8px; }
.sets { gap: 8px; }
.set .li-main { width: 100%; }
.set > .li { display: block; }
.set.open > .li { border-color: var(--accent); }
.chs { list-style: none; padding: 6px 0 0 14px; margin: 0; display: grid; gap: 6px; }
.chs .li { display: block; }

.top { top: env(safe-area-inset-top, 0px); padding-top: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body { background: var(--bg); }
</style>

// We round DOWN (never up) so the app never claims a squad passes when the

function steps(count, thresholds) {
  let p = 0;
  for (const t of thresholds) if (count >= t) p++;

}

    const name = get('name');
    if (!name || !(rating >= 1 && rating <= 99)) {
      errors.push(`Line ${i + 1}: needs a name and a rating 1–99`);
      continue;
    }
    const rarity = (get('rarity') || 'common').toLowerCase();
    players.push({
      id: `p${Date.now().toString(36)}${i}${Math.random().toString(36).slice(2, 6)}`,
      name,
      rating,
      positions: (get('positions') || '').split(/[|/ ;]+/).map(s => s.toUpperCase()).filter(Boolean),
      nation: get('nation'),
      league: get('league'),
      club: get('club'),

      untradeable: truthy(get('untradeable')),
      count: Math.max(1, parseInt(get('count'), 10) || 1),
      price: Math.max(0, parseInt(get('price'), 10) || 0),
      protected: truthy(get('protected')),
    });
  }
  return { players, errors };
}

const esc = v => {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};

function toCsv(club) {
  return [CSV_HEADER, ...club.map(p => [
    p.name, p.rating, (p.positions || []).join('|'), p.nation, p.league, p.club, p.rarity,
    p.untradeable ? 'yes' : 'no', p.count || 1, p.price || 0, p.protected ? 'yes' : 'no',
  ].map(esc).join(','))].join('\n');
}

function download(filename, text, type = 'text/plain') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
}

// Live sync: club + transfer list, run automatically after login and on app resume.
let syncing = false;
async function eaSyncAll(quiet = true) {
  if (syncing || EA.state.status !== 'ready') return;
  syncing = true;
  try {
    await EA.readAccount().catch(() => {});
    render();
    await A.eaTransfers(true).catch(e => toast(e.message, 'bad'));

    await A.eaImport(quiet);
    S.settings.eaLastSync = Date.now(); S.settings.eaAuto = true; persist(); render();
    if (!quiet) toast('Synced with EA');

}

// ---------------------------------------------------------------- solving
let worker = null;
function getWorker() {
  if (worker) return worker;
  try {
    const src = globalThis.__SOLVER_SRC;
    worker = src
      ? new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })))
      : new Worker(new URL('./solver-worker.js', import.meta.url), { type: 'module' });
  } catch { worker = null; }
  return worker;
}

function runSolve(newSeed = false) {
  if (!ui.sbc.reqs.length) return toast('Add at least one requirement', 'bad');
  if (newSeed) ui.seed++;
  ui.solving = true; render();
  const payload = {
    club: S.club, formation: sbcFormation(), reqs: ui.sbc.reqs,
    priceTable: S.prices, useMarket: S.settings.useMarket,
    timeMs: S.settings.thorough ? 4000 : 1500, seed: ui.seed * 7919,
  };
  const done = res => {
    ui.solving = false;
    ui.result = res;
    render();
    $('#result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const w = getWorker();
  if (w) {
    w.onmessage = e => done(e.data.ok ? e.data.result : { error: e.data.error });
    w.onerror = () => { worker = null; setTimeout(() => done(E.solve(payload)), 0); };
    w.postMessage(payload);
  } else setTimeout(() => done(E.solve(payload)), 30);
}

    try {
      const players = await EA.importClub();
      const keep = new Map(S.club.filter(p => p.eaId).map(p => [p.definitionId, p]));
      const imported = players.map(p => {
        const old = keep.get(p.definitionId);
        return { id: `ea${p.eaId}`, ...p, count: 1, price: old?.price || 0, protected: old?.protected || false };
      });
      S.club = [...S.club.filter(p => !p.eaId), ...imported];

      const items = await EA.readTransferList();

        const status = i.tradeState === 'closed' ? 'sold' : i.tradeState === 'expired' ? 'unsold' : i.tradeState === 'active' ? 'listed' : null;

        const t = byEa.get(i.eaId) || { id: uid(), eaId: i.eaId, at: Date.now(), buy: i.paid || 0 };

        if (!byEa.has(i.eaId)) S.trades.unshift(t);

  async eaSetsRefresh() { try { await loadEaSets(); } catch (e) { toast(e.message, 'bad'); } },
  eaPick(el) {
    const c = ui.eaChallenges[+el.dataset.i];
    const reqs = []; const unsupported = [];
    for (const r of c.reqs) {
      const t = EA.translateReq(r);
      if (t) reqs.push(t); else unsupported.push(`${r.key} ${r.scope} ${r.values.join('/')}`);
    }
    if (c.bricks) unsupported.push('locked (brick) slots');
    const slots = c.slots.filter(Boolean);
    if (slots.length !== 11) unsupported.push('squad positions (using 4-3-3, chemistry may differ)');
    ui.sbc = { name: c.name, formation: '4-3-3', reqs, from: null, unsupported,
      custom: slots.length === 11 ? EA.formationFromSlots(slots) : null,
      ea: { setId: c.setId, challengeId: c.id } };
    ui.result = null; closeModal(); render();
    document.getElementById('solver')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    runSolve(false);
  },
  eaSubmit() {
    const r = ui.result;
    if (!r?.ok || !canEaSubmit(r)) return;
    askConfirm(`Submit "${ui.sbc.name}" to EA with these ${r.squad.length} players? They will be used up.`, 'Submit to EA', async () => {
      closeModal();
      try {
        await EA.submitSbc({ ...ui.sbc.ea, eaIds: r.squad.map(p => p.eaId) });
        A.submitted();
        toast('Submitted to EA');
      } catch (e) { toast(e.message, 'bad'); }
    }, false);
  },

  // SBC
  tpl(el) {
    const t = [...TEMPLATES, ...(S.savedSbcs || [])].find(x => x.id === el.dataset.id);
    if (!t) return;
    ui.sbc = { name: t.name, formation: t.formation, reqs: clone(t.reqs), from: t.id, custom: null, ea: null, unsupported: [] };
    ui.result = null; render();
  },
  delSbc(el) {
    S.savedSbcs = S.savedSbcs.filter(x => x.id !== el.dataset.id); persist(); render();
  },
  rmReq(el) { ui.sbc.reqs.splice(+el.dataset.i, 1); ui.sbc.from = null; render(); },
  addReq() {
    const n = ui.newReq;
    const num = v => (v === '' || v == null ? null : Number(v));
    let r;
    if (['rating', 'chem', 'playerChem'].includes(n.t)) r = { t: n.t, n: num(n.n) ?? 0 };
    else if (n.t === 'count') {
      if (n.attr !== 'rare' && !String(n.value).trim()) return toast('Enter a value, e.g. a league name', 'bad');
      r = { t: 'count', attr: n.attr, value: n.attr === 'rare' ? true : String(n.value).trim(), op: n.op, n: num(n.n) ?? 1 };
    } else if (n.t === 'same' || n.t === 'distinct') r = { t: n.t, attr: n.attr === 'rarity' || n.attr === 'quality' || n.attr === 'rare' ? 'league' : n.attr, op: n.op, n: num(n.n) ?? 1 };
    else if (n.t === 'ovr') {
      r = { t: 'ovr', min: num(n.min), max: num(n.max) };
      if (r.min == null && r.max == null) return toast('Set a min or max rating', 'bad');
      ui.sbc.reqs = ui.sbc.reqs.filter(x => x.t !== 'ovr');
    }
    if (['rating', 'chem', 'playerChem'].includes(r.t)) ui.sbc.reqs = ui.sbc.reqs.filter(x => x.t !== r.t);
    ui.sbc.reqs.push(r); ui.sbc.from = null; render();
  },
  saveSbc() {
    const s = ui.sbc;
    if (!s.reqs.length) return toast('Add requirements first', 'bad');
    const existing = (S.savedSbcs || []).find(x => x.name === s.name && x.id.startsWith('u-'));
    if (existing) Object.assign(existing, { formation: s.formation, reqs: clone(s.reqs) });
    else S.savedSbcs = [...(S.savedSbcs || []), { id: `u-${uid()}`, name: s.name || 'My SBC', formation: s.formation, reqs: clone(s.reqs) }];
    persist(); render(); toast('Saved to your challenges');
  },
  solve: () => runSolve(false),
  solveAgain: () => runSolve(true),
  async copyList() {
    const r = ui.result; if (!r?.squad) return;
    const f = sbcFormation();
    const text = `${ui.sbc.name} (${f.name}) — rating ${r.eval.rating}, chem ${r.eval.chem.total}\n` +
      r.squad.map((p, i) => `${f.slots[i].pos}: ${p.generic ? `BUY any ${p.rating} (~${fmt(p.price)})` : `${p.name} ${p.rating}`}`).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { showText('Squad list', 'squad.txt', text, 'text/plain'); }
  },
  submitted() {
    const r = ui.result; if (!r?.ok) return;
    ui.undo = { club: clone(S.club), history: clone(S.history) };
    for (const p of r.squad) {
      if (p.source !== 'club') continue;
      const c = S.club.find(x => x.id === p.id);
      if (!c) continue;
      c.count = (c.count || 1) - 1;
    }
    S.club = S.club.filter(p => (p.count || 1) > 0 && p.count !== 0);
    S.history = [{ name: ui.sbc.name, at: Date.now(), rating: r.eval.rating, chem: r.eval.chem.total, buy: r.buyCost }, ...S.history].slice(0, 50);
    ui.result = null; persist(); render();
    showUndo();
  },
  undo() {
    if (!ui.undo) return;
    S.club = ui.undo.club; S.history = ui.undo.history; ui.undo = null;
    persist(); render(); toast('Restored your club');
  },

  // Squad
  pickSlot(el) { ui.pickSlot = +el.dataset.i; ui.pickQ = ''; openPicker(); },
  assign(el) {
    const i = ui.pickSlot;
    S.squad.ids = S.squad.ids.map(id => (id === el.dataset.id ? null : id));
    S.squad.ids[i] = el.dataset.id || null;
    persist(); closeModal(); render();
  },
  clearSquad() { S.squad.ids = Array(11).fill(null); persist(); render(); },
  squadToSbc() { ui.sbc.formation = S.squad.formation; ui.tab = 'sbc'; render(); toast(`SBC formation set to ${S.squad.formation}`); },

  // Trades
  tSold(el) {
    const x = S.trades.find(t => t.id === el.dataset.id);
    askNumber(`${x.name} sold for (before tax)`, x.list, 'Mark sold', v => {
      const n = parseInt(v, 10);
      if (!(n > 0)) return toast('Enter a valid price', 'bad');
      x.status = 'sold'; x.soldFor = n; persist(); closeModal(); render();
    });
  },
  tUnsold(el) { const x = S.trades.find(t => t.id === el.dataset.id); x.status = 'unsold'; persist(); render(); },
  tRelist(el) {
    const x = S.trades.find(t => t.id === el.dataset.id);
    askNumber(`Relist ${x.name} at (BIN)`, x.list, 'Relist', v => {
      x.list = E.roundToMarket(parseInt(v, 10) || x.list); x.status = 'listed'; persist(); closeModal(); render();
    });
  },
  tDel(el) { S.trades = S.trades.filter(t => t.id !== el.dataset.id); persist(); render(); },
  relistAll() {
    const adj = +(ui.relistAdj || 0) / 100;
    let floored = 0;
    for (const x of S.trades) {
      if (x.status !== 'unsold') continue;
      const breakeven = E.roundToMarket(Math.ceil(x.buy / (1 - E.EA_TAX)), 'up');
      let p = E.roundToMarket(x.list * (1 + adj));
      if (adj < 0 && p < breakeven && x.list >= breakeven) { p = breakeven; floored++; }
      x.list = p; x.status = 'listed';
    }
    persist(); render();
    toast(floored ? `Relisted · ${floored} kept at break-even to avoid a loss` : 'Relisted');
  },
  clearSold() { S.trades = S.trades.filter(t => t.status !== 'sold'); persist(); render(); },

  // Settings
  settings() {
    openModal(`<h2>Settings</h2>
      <h3>Fodder prices</h3>
      <p class="hint">The solver uses these when it suggests buying “any card” of a rating, and to value tradeable club cards without a price. Update them to today's market.</p>
      <div class="prices">${Object.keys(S.prices).sort((a, b) => a - b).map(r => `<label><span class="badge ${qClass(+r)}">${r}</span><input type="number" min="0" data-price="${r}" value="${S.prices[r]}"></label>`).join('')}</div>
      <div class="row gap"><button class="btn small" data-a="savePrices">Save prices</button><button class="btn small" data-a="resetPrices">Reset to defaults</button></div>
      <h3>Backup</h3>
      <p class="hint">Everything lives only on this device. Export a backup to move to another phone.</p>
      <div class="row gap wrap"><button class="btn small" data-a="backup">Export backup</button>
      <label class="btn small">Restore from file<input type="file" accept=".json,application/json" id="restore" hidden></label>
      <button class="btn small" data-a="restorePaste">Restore from text</button>
      <button class="btn small danger" data-a="resetAll">Erase all data</button></div>
      <h3>About</h3>
      <p class="hint">SquadSage is an independent fan tool. It is not affiliated with or endorsed by EA. It never logs in to or automates your game account.</p>
      <div class="row"><button class="btn" data-a="close">Done</button></div>`);
  },
  restorePaste() {
    openModal(`<h2>Restore backup</h2><p class="hint">Paste the backup text you copied earlier. This replaces everything on this device.</p>
      <textarea id="restore-text" rows="8"></textarea>
      <div class="row gap"><button class="btn primary" data-a="restoreRun">Restore</button><button class="btn" data-a="close">Cancel</button></div>`);
  },
  restoreRun() { restoreFrom($('#restore-text').value); },
  savePrices() {
    document.querySelectorAll('[data-price]').forEach(i => { S.prices[i.dataset.price] = Math.max(0, parseInt(i.value, 10) || 0); });
    persist(); toast('Prices saved');
  },
  resetPrices() { S.prices = { ...DEFAULT_PRICES }; persist(); A.settings(); },
  backup: () => showText('Backup', `squadsage-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S), 'application/json'),
  resetAll() {
    askConfirm('Erase your club, trades, saved SBCs and settings from this device?', 'Erase everything', () => {
      S = Store.defaultState(); persist(); closeModal(); ui.result = null; render(); toast('All data erased');
    });
  },
};

function showUndo() {
  const t = $('#toast');
  t.className = 'toast show';
  t.innerHTML = 'Club updated — used cards removed. <button class="link" data-a="undo">Undo</button>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = 'toast'), 8000);
}

function openPicker() {
  const f = formation(S.squad.formation);
  const pos = f.slots[ui.pickSlot].pos;
  const q = ui.pickQ.toLowerCase();
  const list = S.club
    .filter(p => !q || `${p.name} ${p.nation} ${p.league} ${p.club}`.toLowerCase().includes(q))
    .sort((a, b) => (E.inPosition(b, pos) - E.inPosition(a, pos)) || b.rating - a.rating)
    .slice(0, 120);
  const html = `<h2>Choose ${h(pos)}</h2>
    <input type="search" id="pick-q" placeholder="Search" value="${h(ui.pickQ)}" aria-label="Search players">
    <ul class="list picker">
      ${S.squad.ids[ui.pickSlot] ? '<li><button class="li-main" data-a="assign" data-id=""><b>Remove player</b></button></li>' : ''}
      ${list.map(p => `<li class="li"><span class="badge ${qClass(p.rating)} ${p.rare ? 'rare' : ''}">${p.rating}</span>
        <button class="li-main" data-a="assign" data-id="${p.id}"><b>${h(p.name)}</b>
        <small>${h((p.positions || []).join('/'))} · ${h(p.nation)} · ${h(p.league)} · ${h(p.club)}</small></button>
        ${E.inPosition(p, pos) ? '' : '<i class="tag dup">OOP</i>'}</li>`).join('') || '<li class="li muted">No players. Import your club first.</li>'}
    </ul>
    <button class="btn" data-a="close">Cancel</button>`;
  openModal(html);
  const inp = $('#pick-q');
  inp.oninput = () => { ui.pickQ = inp.value; const pos2 = inp.selectionStart; openPicker(); const i2 = $('#pick-q'); i2.focus(); i2.setSelectionRange(pos2, pos2); };
}

// ---------------------------------------------------------------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) {
    const nav = e.target.closest('.nav button');
    if (nav) { ui.tab = nav.dataset.tab; render(); scrollTo(0, 0); }
    return;
  }
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  if (form.dataset.form === 'dlgNum') { const f = pending.num; pending.num = null; f?.(fd.get('v')); return; }
  if (form.dataset.form === 'addTrade') {
    const buy = parseInt(fd.get('buy'), 10), list = parseInt(fd.get('list'), 10);
    if (!(buy >= 0) || !(list >= 150)) return toast('Enter valid prices', 'bad');
    S.trades.unshift({ id: uid(), name: String(fd.get('name')).trim(), buy, list: E.roundToMarket(list), status: 'listed', at: Date.now() });
    persist(); render();
    if (E.afterTax(list) < buy) toast('Heads up: this listing loses coins after the 5% tax', 'bad');
  }
  if (form.dataset.form === 'saveP') {
    const id = form.dataset.id;
    const rarity = fd.get('rarity');
    const data = {
      name: String(fd.get('name')).trim(),
      rating: Math.min(99, Math.max(1, parseInt(fd.get('rating'), 10) || 1)),
      positions: String(fd.get('positions') || '').split(/[|/ ,;]+/).map(s => s.toUpperCase()).filter(Boolean),
      nation: String(fd.get('nation')).trim(), league: String(fd.get('league')).trim(), club: String(fd.get('club')).trim(),
      rarity, rare: rarity !== 'common',
      count: Math.max(1, parseInt(fd.get('count'), 10) || 1),
      price: Math.max(0, parseInt(fd.get('price'), 10) || 0),
      untradeable: fd.get('untradeable') === 'on', protected: fd.get('protected') === 'on',
    };
    if (id) Object.assign(S.club.find(p => p.id === id), data);
    else S.club.unshift({ id: `p${uid()}`, ...data });
    persist(); closeModal(); render(); toast('Saved');
  }
});

function restoreFrom(t) {
  try {
    const data = JSON.parse(t);
    if (!Array.isArray(data.club)) throw new Error('bad');
    S = { ...Store.defaultState(), ...data }; persist(); closeModal(); render(); toast('Backup restored');
  } catch { toast('That is not a SquadSage backup', 'bad'); }
}

function onInput(e) {
  const el = e.target;
  if (el.id === 'restore' && el.files?.[0]) {
    el.files[0].text().then(restoreFrom);
    return;
  }
  const k = el.dataset.in;
  if (!k) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  const rerender = e.type === 'change';
  if (k.startsWith('nr.')) { ui.newReq[k.slice(3)] = v; if (rerender && el.tagName === 'SELECT') render(); return; }
  if (k === 'sbc.name') { ui.sbc.name = v; return; }
  if (k === 'sbc.formation') { ui.sbc.formation = v; ui.sbc.custom = null; ui.sbc.ea = null; ui.result = null; render(); return; }
  if (k.startsWith('set.')) { S.settings[k.slice(4)] = v; persist(); return; }
  if (k === 'sq.formation') { S.squad.formation = v; persist(); render(); return; }
  if (k === 'clubQ') {
    ui.clubQ = v;
    const pos = el.selectionStart; render();
    const i = document.querySelector('[data-in="clubQ"]'); i.focus(); i.setSelectionRange(pos, pos);
    return;
  }
  if (k === 'clubFilter' || k === 'clubSort') { ui[k] = v; render(); return; }
  if (k === 'relistAdj') { ui.relistAdj = v; }
}
document.addEventListener('input', e => { if (e.target.dataset.in === 'clubQ') onInput(e); else if (e.target.dataset.in?.startsWith('nr.') && e.target.tagName !== 'SELECT') onInput(e); else if (e.target.dataset.in === 'sbc.name') onInput(e); });
document.addEventListener('change', e => { if (e.target.dataset.in !== 'clubQ') onInput(e); });

$('#modal').addEventListener('close', () => { ui.pickSlot = null; });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// Offline support
EA.setReadyHandler(() => eaSyncAll(true));
document.addEventListener('deviceready', () => {
  render();
  // Reconnect in the background if you've connected before.
  if (S.settings.eaAuto && EA.available()) EA.connect({ hidden: true });
});
setInterval(() => {
  if (document.visibilityState === 'visible' && EA.state.status === 'ready' && Date.now() - (S.settings.eaLastSync || 0) > 5 * 60000) eaSyncAll(true);
}, 60000);
document.addEventListener('resume', () => {
  if (EA.state.status === 'ready' && Date.now() - (S.settings.eaLastSync || 0) > 3 * 60000) eaSyncAll(true);
});
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !globalThis.__SOLVER_SRC && !window.Capacitor) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
window.addEventListener('online', () => $('#net').textContent = 'Online');
window.addEventListener('offline', () => $('#net').textContent = 'Offline — still works');

EA.setListener(() => { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render(); });
render();

return {  };
})();

</script>
