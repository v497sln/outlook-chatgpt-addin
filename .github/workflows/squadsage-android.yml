name: SquadSage Android APK

on:
  push:
    paths:
      - 'fut-companion/**'
      - '.github/workflows/squadsage-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fut-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Generate Android project
        run: |
          node build-www.mjs
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Use the fixed debug signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: fut-companion/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SquadSage-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SquadSage-apk
          path: fut-companion/SquadSage-${{ github.run_number }}.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: squadsage-build-${{ github.run_number }}
          name: SquadSage build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Android test build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download the .apk on your phone, open it, and allow installing from this source.
          files: fut-companion/SquadSage-${{ github.run_number }}.apk
